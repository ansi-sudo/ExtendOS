require conf/distro/superbird.conf

DISTRO = "extendos"
DISTRO_NAME = "ExtendOS"
DISTRO_VERSION = "0.1.0"

# identity / brand. override per your product.
SUPERBIRD_HOSTNAME = "extendos"
SUPERBIRD_MDNS_SERVICE_NAME = "ExtendOS"
SUPERBIRD_USB_GADGET_NAME = "extendos"
SUPERBIRD_USB_GADGET_MANUFACTURER = "extendos"
SUPERBIRD_USB_GADGET_PRODUCT = "ExtendOS"

# baked into chromium-kiosk at do_install. point at your webapp.
CHROMIUM_KIOSK_URL = "file:///usr/share/extendos-default/index.html"
