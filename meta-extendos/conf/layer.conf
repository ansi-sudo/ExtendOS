BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "extendos"
BBFILE_PATTERN_extendos := "^${LAYERDIR}/"
BBFILE_PRIORITY_extendos = "20"

LAYERVERSION_extendos = "1"
LAYERSERIES_COMPAT_extendos = "scarthgap wrynose"
LAYERDEPENDS_extendos = "core superbird meson chromium-browser-layer"
